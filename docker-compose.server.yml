services:
  caregrid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caregrid
    restart: unless-stopped
    init: true
    env_file:
      - .env.server
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./caregrid-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
